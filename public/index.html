<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asul IA</title>
<style>
:root{--bg:#f5f8ff;--panel:#fff;--side:#eaf0ff;--text:#0f1b3d;--muted:#5d6b8f;--brand:#2563eb;--brand2:#1d4ed8;--bubble:#e0e9ff;--border:#d5def5;--code:#0f172a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--panel:#111833;--side:#0d142b;--text:#e8eeff;--muted:#8d9bc4;--brand:#4f8cff;--brand2:#3b78f0;--bubble:#1b2a55;--border:#243257}}
:root[data-theme="dark"]{--bg:#0b1020;--panel:#111833;--side:#0d142b;--text:#e8eeff;--muted:#8d9bc4;--brand:#4f8cff;--brand2:#3b78f0;--bubble:#1b2a55;--border:#243257}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
aside{width:270px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;flex-shrink:0;transition:transform .2s}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 4px 8px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7aa7ff);display:grid;place-items:center;color:#fff;font-style:normal}
.new{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:11px;font-weight:600}
.new:hover{background:var(--brand2)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;border-radius:10px;padding:9px 10px;cursor:pointer;gap:6px;font-size:14px}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:var(--panel)}
.item button{background:none;border:0;color:var(--muted);opacity:0;padding:0 4px}
.item:hover button{opacity:1}
.foot{display:flex;gap:8px}
.foot button{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;font-size:13px}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:16px;margin:0;flex:1}
#menu{display:none;background:none;border:0;font-size:22px}
#msgs{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{display:flex;gap:10px;line-height:1.55;font-size:15.5px}
.m .av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.m.bot .av{background:linear-gradient(135deg,var(--brand),#7aa7ff);color:#fff}
.m.user{flex-direction:row-reverse}
.m.user .av{background:var(--bubble);color:var(--brand)}
.m .t{max-width:calc(100% - 44px);overflow-wrap:anywhere}
.m.user .t{background:var(--bubble);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.t p{margin:0 0 .7em}.t p:last-child{margin:0}
.t pre{background:var(--code);color:#e5edff;padding:12px;border-radius:10px;overflow-x:auto;font-size:13px}
.t code{background:var(--bubble);padding:1px 5px;border-radius:5px;font-size:.9em}
.t pre code{background:none;padding:0}
.hero{text-align:center;margin-top:12vh}
.hero h2{font-size:28px;margin:0 0 6px}
.hero p{color:var(--muted);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:9px 14px;font-size:14px}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
form{padding:12px 16px 16px;background:var(--bg)}
.box{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:8px 8px 8px 14px}
.box:focus-within{border-color:var(--brand)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;max-height:160px;padding:8px 0}
#send,#mic{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:17px}
#mic{background:var(--bubble);color:var(--brand)}
#send:disabled{opacity:.5}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.err{color:#d93a3a}
.dots::after{content:"●●●";letter-spacing:2px;color:var(--muted);animation:b 1s infinite}
@keyframes b{50%{opacity:.25}}
@media (max-width:760px){
aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);padding-top:calc(14px + env(safe-area-inset-top,0px))}
aside.open{transform:none}
#menu{display:block}
}
</style>
</head>
<body>
<aside id="side">
  <div class="logo"><i>A</i> Asul IA</div>
  <button class="new" id="new">+ Nuevo chat</button>
  <div id="list"></div>
  <div class="foot"><button id="theme">Tema</button><button id="clear">Borrar todo</button></div>
</aside>
<main>
  <header><button id="menu" aria-label="Menú">☰</button><h1 id="title">Asul IA</h1></header>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <form id="form">
    <div class="box">
      <textarea id="inp" rows="1" placeholder="Escribe tu mensaje…"></textarea>
      <button id="send" aria-label="Enviar">➤</button>
    </div>
    <div class="note">Asul IA puede equivocarse. Verifica la información importante.</div>
  </form>
</main>
<script>
(function(){
var SYS="Eres Asul IA, el asistente de inteligencia artificial de Asul Academy, una academia de idiomas. Responde en el idioma del usuario (por defecto español), de forma clara, amable y útil. Ayuda con idiomas, tareas, redacción, programación y dudas generales. Usa formato Markdown sencillo.";
var chats=[],cur=null,busy=false,store=null;
try{store=window.localStorage}catch(e){}
function load(){try{chats=JSON.parse(store.getItem("asulia")||"[]")}catch(e){chats=[]}}
function save(){try{store.setItem("asulia",JSON.stringify(chats))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(s){
  var parts=s.split(/```/),out="";
  for(var i=0;i<parts.length;i++){
    if(i%2){var c=parts[i].replace(/^[^\n]*\n/,"");out+="<pre><code>"+esc(c)+"</code></pre>"}
    else{out+=esc(parts[i]).split(/\n{2,}/).map(function(p){
      p=p.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
      return p.trim()?"<p>"+p+"</p>":""}).join("")}
  }
  return out;
}
function getChat(){return chats.find(function(c){return c.id===cur})}
function renderList(){
  var l=$("list");l.innerHTML="";
  chats.forEach(function(c){
    var d=document.createElement("div");d.className="item"+(c.id===cur?" on":"");
    var s=document.createElement("span");s.textContent=c.title;
    var b=document.createElement("button");b.textContent="✕";b.title="Eliminar";
    b.onclick=function(e){e.stopPropagation();chats=chats.filter(function(x){return x!==c});if(cur===c.id)cur=null;save();render()};
    d.onclick=function(){cur=c.id;render();$("side").classList.remove("open")};
    d.append(s,b);l.append(d);
  });
}
function bubble(role,html,text){
  var m=document.createElement("div");m.className="m "+(role==="user"?"user":"bot");
  var a=document.createElement("div");a.className="av";a.textContent=role==="user"?"Tú":"A";
  var t=document.createElement("div");t.className="t";
  if(role==="user")t.textContent=text;else t.innerHTML=html;
  m.append(a,t);return t;
}
function render(){
  renderList();
  var w=$("wrap");w.innerHTML="";
  var c=getChat();
  $("title").textContent=c?c.title:"Asul IA";
  if(!c||!c.msgs.length){
    var h=document.createElement("div");h.className="hero";
    h.innerHTML="<h2>¿En qué te ayudo hoy?</h2><p>Tu asistente de IA de Asul Academy</p>";
    var ch=document.createElement("div");ch.className="chips";
    ["Explícame el present perfect","Corrige mi texto en inglés","Dame un plan para aprender francés","Ayúdame con una tarea"].forEach(function(q){
      var b=document.createElement("button");b.type="button";b.textContent=q;b.onclick=function(){$("inp").value=q;send()};ch.append(b)});
    h.append(ch);w.append(h);return;
  }
  c.msgs.forEach(function(m){w.append(bubble(m.role,md(m.content),m.content).parentNode)});
  scroll();
}
function scroll(){var e=$("msgs");e.scrollTop=e.scrollHeight}
async function send(){
  if(busy)return;
  var inp=$("inp"),text=inp.value.trim();if(!text)return;
  var c=getChat();
  if(!c){c={id:String(Date.now()),title:text.slice(0,40),msgs:[]};chats.unshift(c);cur=c.id}
  c.msgs.push({role:"user",content:text});save();
  inp.value="";inp.style.height="auto";
  render();
  var t=bubble("assistant","<span class='dots'></span>");
  $("wrap").append(t.parentNode);scroll();
  busy=true;$("send").disabled=true;
  var hist=c.msgs.slice(-20).map(function(m){return{role:m.role,content:m.content}});
  try{
    var res=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist})});
    var data=await res.json();
    if(!res.ok)throw new Error(data.error||"Error");
    t.innerHTML=md(data.text);
    c.msgs.push({role:"assistant",content:data.text});save();
  }catch(e){
    t.innerHTML="<p class='err'>"+esc(e.message||"No pude responder. Inténtalo de nuevo.")+"</p>";
  }
  busy=false;$("send").disabled=false;renderList();scroll();
}
$("form").onsubmit=function(e){e.preventDefault();send()};
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("inp").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,160)+"px"});
$("new").onclick=function(){cur=null;render();$("side").classList.remove("open");$("inp").focus()};
$("menu").onclick=function(){$("side").classList.toggle("open")};
$("clear").onclick=function(){if(confirm("¿Borrar todos los chats?")){chats=[];cur=null;save();render()}};
$("theme").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark";try{store.setItem("asultheme",r.dataset.theme)}catch(e){}};
try{var th=store.getItem("asultheme");if(th)document.documentElement.dataset.theme=th}catch(e){}
load();render();
})();
</script>
</body>
</html>
